services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://freewave:freewave@postgres:5432/freewave?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-development-secret-change-before-production
      AUTH_URL: http://localhost:3000
      S3_REGION: us-east-1
      S3_BUCKET: freewave-media
      S3_PUBLIC_BASE_URL: http://localhost:9000/freewave-media
      MAX_AUDIO_UPLOAD_BYTES: "52428800"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freewave
      POSTGRES_USER: freewave
      POSTGRES_PASSWORD: freewave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres-data:
